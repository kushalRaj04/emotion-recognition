<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Emotion Result</title>

    <style>

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: Arial, sans-serif;
            background: #f4f7fb;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .container {
            width: 90%;
            max-width: 700px;
            background: white;
            padding: 35px;
            border-radius: 15px;
            box-shadow: 0 5px 25px rgba(0, 0, 0, 0.1);
        }

        h1 {
            text-align: center;
            margin-bottom: 25px;
        }

        .result {
            text-align: center;
            padding: 20px;
            margin-bottom: 30px;
            background: #f0f4ff;
            border-radius: 12px;
        }

        .emotion {
            font-size: 36px;
            font-weight: bold;
            margin: 15px 0;
        }

        .confidence {
            font-size: 20px;
        }

        h2 {
            margin-bottom: 20px;
        }

        .emotion-row {
            margin-bottom: 15px;
        }

        .emotion-name {
            display: flex;
            justify-content: space-between;
            margin-bottom: 5px;
            font-weight: bold;
        }

        .bar-container {
            width: 100%;
            height: 20px;
            background: #e5e7eb;
            border-radius: 10px;
            overflow: hidden;
        }

        .bar {
            height: 100%;
            background: #4f46e5;
            border-radius: 10px;
        }

        .back-button {
            display: block;
            width: 100%;
            text-align: center;
            margin-top: 30px;
            padding: 12px;
            background: #4f46e5;
            color: white;
            text-decoration: none;
            border-radius: 8px;
        }

        .back-button:hover {
            background: #3730a3;
        }

    </style>

</head>

<body>

    <div class="container">

        <h1>🎙️ Emotion Recognition Result</h1>

        <div class="result">

            <p>Predicted Emotion</p>

            <div class="emotion">
                {{ emotion }}
            </div>

            <div class="confidence">
                Confidence: <strong>{{ confidence }}%</strong>
            </div>

        </div>


        <h2>Emotion Probabilities</h2>


        {% for emotion_name in probabilities %}

        <div class="emotion-row">

            <div class="emotion-name">

                <span>
                    {{ emotion_name }}
                </span>

                <span>
                    {{ probabilities[emotion_name] }}%
                </span>

            </div>


            <div class="bar-container">

                <div
                    class="bar"
                    data-width="{{ probabilities[emotion_name] }}"
                ></div>

            </div>

        </div>

        {% endfor %}


        <a href="/" class="back-button">
            Analyze Another Audio
        </a>

    </div>


    <script>

        const bars = document.querySelectorAll(".bar");

        bars.forEach(function(bar) {

            const width = bar.getAttribute("data-width");

            bar.style.width = width + "%";

        });

    </script>

</body>

</html>
